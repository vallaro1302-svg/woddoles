# Instalador do Woddoles: pré-respostas do Debian Installer.
# O que NÃO está aqui continua sendo perguntado (disco/partições, senha, rede).

# Idioma, teclado (ABNT2) e fuso
d-i debian-installer/locale string pt_BR.UTF-8
d-i debian-installer/language string pt
d-i debian-installer/country string BR
d-i keyboard-configuration/xkb-keymap select br
d-i console-setup/ask_detect boolean false
d-i time/zone string America/Sao_Paulo
d-i clock-setup/utc boolean true

# Nome da máquina
d-i netcfg/get_hostname string woddoles
d-i netcfg/get_domain string local

# Conta: sem root; o usuário "woddoles" recebe sudo. A senha é perguntada.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Woddoles
d-i passwd/username string woddoles

# Sem telemetria; GRUB no disco principal
d-i popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

# No fim da instalação: login automático + instalar Sober/TLauncher no 1º boot com internet
d-i preseed/late_command string \
    in-target install -D -m 644 /usr/share/woddoles/autologin.conf /etc/systemd/system/getty@tty1.service.d/woddoles-autologin.conf ; \
    in-target systemctl enable woddoles-setup-games.service ; \
    in-target sed -i 's/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=2/' /etc/default/grub ; \
    in-target update-grub
