name: Build Woddoles ISO
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Dependências
        run: |
          apt-get update
          apt-get install -y git ca-certificates live-build debootstrap xorriso squashfs-tools
      - uses: actions/checkout@v4
      - name: Gerar ISO
        run: bash build-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: woddoles-iso
          path: woddoles.iso
